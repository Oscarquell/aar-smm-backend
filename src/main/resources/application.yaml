spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: portfolio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/azem_portfolio}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:storage/uploads}
  birthpinger:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      chat-id: ${TELEGRAM_CHAT_ID:}
    scheduler:
      cron: ${BIRTHPINGER_CRON:0 0 9 * * *}
      zone: ${BIRTHPINGER_TIMEZONE:Asia/Bishkek}
